<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌唱履歴 | 活動名</title><link rel="stylesheet" href="../../style.css"></head><body>
<header><a class="logo" href="../../">NAME<span>_</span></a><nav><a href="../../archive/">ARCHIVE</a><a href="../">SONGS</a></nav></header>

<main>
<section class="section historyHero">
  <a class="backlink" href="../">← SONG DATABASE</a>
  <p class="eyebrow">PERFORMANCE HISTORY</p>
  <h1 id="songTitle" class="historyTitle">SONG</h1>
  <div class="historyMeta">
    <div><span>ARTIST</span><strong id="artistName">-</strong></div>
    <div><span>TOTAL</span><strong><i id="totalCount">0</i> PERFORMANCES</strong></div>
  </div>
</section>

<section class="section">
  <p class="eyebrow">ARCHIVES</p>
  <h2>歌唱履歴</h2>
  <div id="historyList" class="historyList"></div>
  <p id="notFound" class="muted" hidden>該当する歌唱履歴が見つかりませんでした。</p>
</section>
</main>

<footer><b>NAME</b><span>PERFORMANCE HISTORY</span></footer>

<script src="../../data/archives.js"></script>
<script>
const params = new URLSearchParams(location.search);
const songName = params.get("song") || "";
const artistName = params.get("artist") || "";

document.title = songName ? `${songName} 歌唱履歴 | 活動名` : "歌唱履歴 | 活動名";
document.getElementById("songTitle").textContent = songName || "SONG";
document.getElementById("artistName").textContent = artistName || "未登録";

const performances = [];

ARCHIVES.forEach(archive => {
  archive.songs
    .filter(song =>
      song.type === "song" &&
      song.title === songName &&
      (song.artist || "未登録") === artistName
    )
    .forEach(song => {
      performances.push({
        date: archive.date,
        archiveTitle: archive.title,
        time: song.time
      });
    });
});

performances.sort((a,b) => b.date.localeCompare(a.date));
document.getElementById("totalCount").textContent = performances.length;

const root = document.getElementById("historyList");
const nf = document.getElementById("notFound");

if(!performances.length){
  nf.hidden = false;
} else {
  root.innerHTML = performances.map(p => `
    <a class="historyCard" href="../../archive/${p.date}/?t=${p.time}">
      <div class="historyDate">${p.date.replaceAll("-",".")}</div>
      <div class="historyArchiveTitle">${p.archiveTitle}</div>
      <div class="historyListen">LISTEN ↗</div>
    </a>
  `).join("");
}
</script>
</body></html>
