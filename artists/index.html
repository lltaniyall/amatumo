<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARTIST | 活動名</title><link rel="stylesheet" href="../style.css"></head><body>
<header><a class="logo" href="../">NAME<span>_</span></a><nav><a href="../archive/">ARCHIVE</a><a href="../songs/">曲数</a></nav></header>

<main>
<section class="section historyHero">
  <a class="backlink" href="../songs/">← 歌の目録へ</a>
  <p class="eyebrow">ARTIST SONGS</p>
  <h1 id="artistTitle" class="historyTitle">ARTIST</h1>
  <div class="historyMeta">
    <div><span>曲数</span><strong><i id="songTotal">0</i>曲</strong></div>
    <div><span>歌った回数</span><strong><i id="performanceTotal">0</i>回</strong></div>
  </div>
</section>

<section class="section">
  <p class="eyebrow">SONG LIST</p>
  <h2>歌った曲</h2><div class="heroRule pageTitleRule artistTitleRule" aria-hidden="true"><span>◆</span></div>
  <div class="artistSongList" id="artistSongList"></div>
  <p id="notFound" class="muted" hidden>このアーティストの楽曲が見つかりませんでした。</p>
</section>
</main>

<footer><b>NAME</b><span>ARTIST SONGS</span></footer>

<script src="../data/archives.js"></script>
<script>
const params = new URLSearchParams(location.search);
const artist = params.get("artist") || "";

document.title = artist ? `${artist} 楽曲一覧 | 活動名` : "ARTIST | 活動名";
document.getElementById("artistTitle").textContent = artist || "ARTIST";

const map = new Map();

ARCHIVES.forEach(archive => {
  archive.songs
    .filter(song => song.type === "song" && (song.artist || "未登録") === artist)
    .forEach(song => {
      if(!map.has(song.title)){
        map.set(song.title, {title:song.title, count:0});
      }
      map.get(song.title).count++;
    });
});

const songs = [...map.values()].sort((a,b) =>
  new Intl.Collator("ja", {numeric:true, sensitivity:"base"}).compare(a.title,b.title)
);

document.getElementById("songTotal").textContent = songs.length;
document.getElementById("performanceTotal").textContent =
  songs.reduce((sum,s)=>sum+s.count,0);

const root = document.getElementById("artistSongList");
const nf = document.getElementById("notFound");

if(!songs.length){
  nf.hidden = false;
}else{
  root.innerHTML = songs.map(song => {
    const p = new URLSearchParams({song:song.title, artist});
    return `
      <a class="artistSongCard" href="../songs/history/?${p.toString()}">
        <div class="artistSongTitle">${song.title}</div>
        <div class="artistSongCount">${song.count}回${song.count===1?"":"S"}</div>
        <div class="artistSongArrow">↗</div>
      </a>
    `;
  }).join("");
}
</script>
</body></html>
