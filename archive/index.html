<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>歌枠の記録 | 活動名</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="logo" href="../">NAME<span>_</span></a>
  <nav><a href="./">ARCHIVE</a><a href="../songs/">SONGS</a></nav>
</header>

<main class="archiveIndexPage">
  <section class="archiveIndexHero">
    <div class="archiveIndexHeroInner">
      <p class="eyebrow">LIVE ARCHIVE</p>
      <h1>歌枠の記録</h1>
      <div class="heroRule pageTitleRule" aria-hidden="true"><span>◆</span></div>
      <p class="archiveLead">これまでの歌枠を、配信日ごとにまとめてゐます。</p>
    </div>
  </section>

  <section class="section archiveIndexSection">
    <div id="archiveCards" class="cards archiveIndexCards"></div>
  </section>
</main>

<footer><b>NAME</b><span>ARCHIVE</span></footer>

<script src="../data/archives.js"></script>
<script>
const root = document.getElementById("archiveCards");

const simpleKanji = "〇一二三四五六七八九";
const daiji = ["","壱","弐","参","肆","伍","陸","漆","捌","玖"];

function formatArchiveDate(value){
  const [y,m,d] = value.split("-").map(Number);
  const year = String(y).split("").map(n => simpleKanji[Number(n)]).join("");
  const jpNumber = n => n < 10 ? simpleKanji[n]
    : n === 10 ? "十"
    : n < 20 ? "十" + simpleKanji[n - 10]
    : simpleKanji[Math.floor(n / 10)] + "十" + (n % 10 ? simpleKanji[n % 10] : "");
  return `${year}年${jpNumber(m)}月${jpNumber(d)}日`;
}

function formatDaijiCount(n){
  n = Math.max(0, Math.floor(Number(n) || 0));
  if(n === 0) return "〇曲";
  if(n < 10) return daiji[n] + "曲";
  if(n < 20) return "拾" + (n % 10 ? daiji[n % 10] : "") + "曲";
  if(n < 100){
    const tens = Math.floor(n / 10);
    const ones = n % 10;
    return daiji[tens] + "拾" + (ones ? daiji[ones] : "") + "曲";
  }
  return String(n).split("").map(x => daiji[Number(x)] || "〇").join("") + "曲";
}

root.innerHTML = [...ARCHIVES].reverse().map(a => {
  const count = a.songs.filter(s => s.type === "song").length;
  return `<a class="card archiveIndexCard" href="./${a.date}/">
    <span class="card-date">${formatArchiveDate(a.date)}</span>
    <h3>${a.title}</h3>
    <p class="card-meta">${formatDaijiCount(count)}</p>
    <span class="archiveCardArrow" aria-hidden="true">↗</span>
  </a>`;
}).join("");
</script>
</body>
</html>
